services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-job_copilot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://job_copilot:change_me@postgres:5432/job_copilot}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      MAX_RESUME_SIZE_MB: ${MAX_RESUME_SIZE_MB:-10}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      JOB_FETCH_CONNECT_TIMEOUT: ${JOB_FETCH_CONNECT_TIMEOUT:-5}
      JOB_FETCH_TIMEOUT: ${JOB_FETCH_TIMEOUT:-20}
      JOB_FETCH_MAX_SIZE: ${JOB_FETCH_MAX_SIZE:-2000000}
      JOB_FETCH_MAX_REDIRECTS: ${JOB_FETCH_MAX_REDIRECTS:-5}
      JOB_IMPORT_RATE_LIMIT: ${JOB_IMPORT_RATE_LIMIT:-20}
      JOB_IMPORT_RATE_WINDOW: ${JOB_IMPORT_RATE_WINDOW:-60}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes:
      - ./backend:/app
      - uploaded_resumes:/app/storage
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [backend]
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    volumes: [./frontend:/app, /app/node_modules]
volumes:
  postgres_data:
  uploaded_resumes:
